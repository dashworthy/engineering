schema_version: "1.1"
name: cd-review-shape
description: Reviewing a sketched interface should invoke using-codebase-design in review mode and judge it against SOLID / anti-patterns, naming the real shape problems.
tags: [codebase-design, review-mode]
runs: 3
execution:
  max_turns: 18
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite]
  prompt: |
    Here's a proposed interface for a new member-management module in Bookery.
    Before we build against it, review the shape/design and tell me whether it's
    sound.

    ```php
    final class MemberManager {
        // create + persist + validate + welcome email, all here
        public function createMember(
            array $data, \PDO $db, Logger $log, Mailer $mail,
            bool $sendWelcome, bool $skipValidation, ?string $promoCode
        ): int;

        public function updateMemberAndMaybeNotifyAndRecalcFees(
            int $id, array $fields, bool $notify
        ): void;

        // callers reach in for the raw connection when they need something else
        public function getRawDbHandle(): \PDO;
    }
    ```
context:
  scaffold_script: scaffold.sh
