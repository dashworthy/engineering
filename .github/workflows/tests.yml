name: tests

on:
  push:
    branches: [0.x]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: engineering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite is POSIX sh and drives JSON parsing through python3 (stdlib
      # only, never jq); both ship on ubuntu-latest, so no extra setup is needed.
      - name: Run the engineering foundation suite
        run: sh tests/suite.sh
